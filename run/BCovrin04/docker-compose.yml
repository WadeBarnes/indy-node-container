services:
  bcovrin04-node:
    image: ${IMAGE}
    container_name: ${INDY_NODE_NAME}-${NODE_CONTAINER_NAME}
    networks:
      - ${NODE_NETWORK}
    ports:
      - "${INDY_NODE_PORT}:${INDY_NODE_PORT}"
      - "${INDY_CLIENT_PORT}:${INDY_CLIENT_PORT}"
    volumes:
      - ./etc_indy:/etc/indy
      - ./lib_indy:/var/lib/indy
      - ./log_indy:/var/log/indy
    environment:
      - INDY_NODE_IP=${INDY_NODE_IP}
      - INDY_NODE_PORT=${INDY_NODE_PORT}
      - INDY_CLIENT_IP=${INDY_CLIENT_IP}
      - INDY_CLIENT_PORT=${INDY_CLIENT_PORT}
      - INDY_NETWORK_NAME=${INDY_NETWORK_NAME}
      - INDY_NODE_NAME=${INDY_NODE_NAME}
      - CONTROLLER_CONTAINER_NAME=${INDY_NODE_NAME}-${CONTROLLER_CONTAINER_NAME}
    logging:
        driver: "json-file"
        options:
          max-file: "5"
          max-size: "100m"
    env_file:
      - .node.env
    restart: always

  bcovrin04-controller:
    image: ${IMAGE_NAME_CONTROLLER}
    init: true
    container_name: ${INDY_NODE_NAME}-${CONTROLLER_CONTAINER_NAME}
    networks:
      - ${NODE_NETWORK}
    environment:
      - INDY_NETWORK_NAME=${INDY_NETWORK_NAME}
      - NODE_CONTAINER=${INDY_NODE_NAME}-${NODE_CONTAINER_NAME}
      - CONTROLLER_CONTAINER=${INDY_NODE_NAME}-${CONTROLLER_CONTAINER_NAME}
    volumes:
      - ./etc_indy:/etc/indy
      - ${SOCK}:/var/run/docker.sock
    logging:
        driver: "json-file"
        options:
          max-file: "5"
          max-size: "100m"
    restart: always
    depends_on:
      - bcovrin04-node
